<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Health & Diet Tracker</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Preset Dietary Options ---
    const DIETARY_OPTIONS = [
      "No Restrictions",
      "Vegetarian",
      "Non-Vegetarian",
      "Eggetarian",
      "Vegan",
      "Keto",
      "High Protein",
      "Gluten-Free",
      "Dairy-Free"
    ];

    // --- Lucide Icon Wrapper Component ---
    function Icon({ name, size = 18, className = "" }) {
      const iconRef = useRef(null);

      useEffect(() => {
        if (window.lucide && iconRef.current) {
          window.lucide.createIcons({
            attrs: {
              class: `lucide lucide-${name} ${className}`
            },
            nameAttr: 'data-lucide'
          });
        }
      }, [name, className]);

      return <i ref={iconRef} data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
    }

    // --- Fallback Local AI Plan Generator ---
    function generateFallbackPlan(profile) {
      const isWeightLoss = profile.goal.toLowerCase().includes("loss");
      const isMuscle = profile.goal.toLowerCase().includes("muscle");
      
      const calories = isWeightLoss ? 1800 : isMuscle ? 2600 : 2100;
      const protein = isMuscle ? 170 : isWeightLoss ? 135 : 115;
      const carbs = isMuscle ? 275 : isWeightLoss ? 145 : 210;
      const fats = isWeightLoss ? 50 : isMuscle ? 70 : 60;

      const restriction = (profile.dietaryRestrictions || "").toLowerCase();
      const isVeg = (restriction.includes("vegetarian") && !restriction.includes("non-vegetarian")) || restriction.includes("vegan");
      const isKeto = restriction.includes("keto");

      return {
        id: "plan_" + Date.now(),
        date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" }),
        profile: { ...profile },
        summary: {
          calories,
          protein,
          carbs,
          fats,
          waterLiters: Math.round((Number(profile.weight || 70) * 0.035) * 10) / 10
        },
        meals: [
          {
            type: "Breakfast",
            time: "8:00 AM",
            name: isVeg ? "Avocado Toast & Greek Yogurt Bowl" : isKeto ? "Spinach & Mushroom Omelet with Avocado" : "Oatmeal Bowl with Berries & Scrambled Eggs",
            calories: Math.round(calories * 0.25),
            protein: isVeg ? "22g" : "30g",
            carbs: isKeto ? "10g" : "45g",
            fats: "14g",
            ingredients: isVeg ? ["Whole grain bread", "Avocado", "Greek Yogurt", "Berries", "Chia seeds"] : ["Eggs", "Spinach", "Avocado", "Olive Oil", "Berries"]
          },
          {
            type: "Lunch",
            time: "1:00 PM",
            name: isVeg ? "Quinoa Bowl with Roasted Chickpeas & Tahini" : "Grilled Chicken Quinoa Bowl with Steamed Veggies",
            calories: Math.round(calories * 0.35),
            protein: isVeg ? "28g" : "45g",
            carbs: "55g",
            fats: "18g",
            ingredients: isVeg ? ["Quinoa", "Chickpeas", "Cucumber", "Cherry tomatoes", "Tahini dressing"] : ["Chicken breast", "Quinoa", "Broccoli", "Olive oil", "Bell peppers"]
          },
          {
            type: "Afternoon Snack",
            time: "4:30 PM",
            name: "Protein Berry Smoothie & Mixed Almonds",
            calories: Math.round(calories * 0.15),
            protein: "20g",
            carbs: "25g",
            fats: "10g",
            ingredients: ["Almond milk", "Plant protein powder", "Frozen berries", "Almonds"]
          },
          {
            type: "Dinner",
            time: "7:30 PM",
            name: isVeg ? "Lentil & Vegetable Curry with Brown Rice" : "Pan-Seared Salmon with Asparagus & Sweet Potato",
            calories: Math.round(calories * 0.25),
            protein: isVeg ? "25g" : "40g",
            carbs: "40g",
            fats: "16g",
            ingredients: isVeg ? ["Lentils", "Brown Rice", "Coconut Milk", "Spinach", "Curry Spices"] : ["Salmon fillet", "Asparagus", "Sweet Potato", "Lemon", "Garlic"]
          }
        ],
        tips: [
          "Drink 500ml of fresh water upon waking up to optimize digestion.",
          `Ensure you distribute your target ${protein}g of protein evenly across all 4 meals.`,
          "Finish dinner at least 2.5 hours before sleeping for enhanced metabolic repair."
        ]
      };
    }

    // --- Main React Application Component ---
    function App() {
      const [activeTab, setActiveTab] = useState("generator");

      // API Key & Key Modal State
      const [apiKey, setApiKey] = useState(() => localStorage.getItem("gemini_user_api_key") || "");
      const [showKeyModal, setShowKeyModal] = useState(false);
      const [tempApiKey, setTempApiKey] = useState("");

      // Fluid Form Input State
      const [formData, setFormData] = useState({
        age: "26",
        weight: "72",
        height: "178",
        goal: "Weight Loss",
        activity: "Moderate Exercise (3-4 days/wk)",
        dietaryRestriction: "Vegetarian"
      });

      const [customDietNote, setCustomDietNote] = useState("");

      // Application Data State
      const [currentPlan, setCurrentPlan] = useState(null);
      const [savedPlans, setSavedPlans] = useState([]);
      const [isGenerating, setIsGenerating] = useState(false);
      const [statusNotice, setStatusNotice] = useState("");

      // Chatbot State
      const [chatMessages, setChatMessages] = useState([
        { sender: "ai", text: "Hello! I am your AI Health & Nutrition Coach powered by Gemini 1.5 Flash. Ask me anything about meal swaps, recipe ideas, or adjusting your macro targets!" }
      ]);
      const [chatInput, setChatInput] = useState("");
      const [isChatThinking, setIsChatThinking] = useState(false);

      // Grocery Checklist Checked Items State
      const [groceryChecked, setGroceryChecked] = useState({});
      const chatEndRef = useRef(null);

      useEffect(() => {
        const storedPlans = localStorage.getItem("ai_diet_plans");
        if (storedPlans) {
          try {
            const parsed = JSON.parse(storedPlans);
            setSavedPlans(parsed);
            if (parsed.length > 0) setCurrentPlan(parsed[0]);
          } catch (err) {
            console.error("Failed to parse local history:", err);
          }
        } else {
          const initialPlan = generateFallbackPlan({
            age: 26, weight: 72, height: 178, goal: "Weight Loss", dietaryRestrictions: "Vegetarian"
          });
          setCurrentPlan(initialPlan);
          setSavedPlans([initialPlan]);
          localStorage.setItem("ai_diet_plans", JSON.stringify([initialPlan]));
        }
      }, []);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [chatMessages, isChatThinking]);

      const handleSaveApiKey = (e) => {
        e.preventDefault();
        const trimmed = tempApiKey.trim();
        setApiKey(trimmed);
        localStorage.setItem("gemini_user_api_key", trimmed);
        setShowKeyModal(false);
        setStatusNotice(trimmed ? "Custom Gemini API Key saved!" : "Using built-in/fallback generator mode.");
        setTimeout(() => setStatusNotice(""), 3000);
      };

      const handleInputChange = (field, value) => {
        setFormData(prev => ({ ...prev, [field]: value }));
      };

      // Call Gemini 1.5 Flash API to Generate Diet Plan
      const handleGeneratePlan = async (e) => {
        e.preventDefault();
        setIsGenerating(true);
        setStatusNotice("");

        const finalDietaryString = customDietNote.trim()
          ? `${formData.dietaryRestriction}, ${customDietNote.trim()}`
          : formData.dietaryRestriction;

        const profileData = {
          age: Number(formData.age) || 25,
          weight: Number(formData.weight) || 70,
          height: Number(formData.height) || 175,
          goal: formData.goal,
          activity: formData.activity,
          dietaryRestrictions: finalDietaryString
        };

        if (apiKey) {
          try {
            const promptText = `Generate a structured daily diet and nutrition plan for a person with this profile:
- Age: ${profileData.age} years
- Weight: ${profileData.weight} kg
- Height: ${profileData.height} cm
- Fitness Goal: ${profileData.goal}
- Activity Level: ${profileData.activity}
- Dietary Restrictions/Preferences: ${profileData.dietaryRestrictions}

Return ONLY a valid JSON object with this EXACT structure (no markdown fences around the json, just raw json):
{
  "summary": {
    "calories": number,
    "protein": number,
    "carbs": number,
    "fats": number,
    "waterLiters": number
  },
  "meals": [
    {
      "type": "Breakfast",
      "time": "8:00 AM",
      "name": "Meal name",
      "calories": number,
      "protein": "30g",
      "carbs": "40g",
      "fats": "12g",
      "ingredients": ["item 1", "item 2", "item 3"]
    },
    {
      "type": "Lunch",
      "time": "1:00 PM",
      "name": "Meal name",
      "calories": number,
      "protein": "45g",
      "carbs": "50g",
      "fats": "15g",
      "ingredients": ["item 1", "item 2"]
    },
    {
      "type": "Afternoon Snack",
      "time": "4:30 PM",
      "name": "Meal name",
      "calories": number,
      "protein": "20g",
      "carbs": "20g",
      "fats": "8g",
      "ingredients": ["item 1", "item 2"]
    },
    {
      "type": "Dinner",
      "time": "7:30 PM",
      "name": "Meal name",
      "calories": number,
      "protein": "40g",
      "carbs": "35g",
      "fats": "14g",
      "ingredients": ["item 1", "item 2"]
    }
  ],
  "tips": ["Tip 1", "Tip 2", "Tip 3"]
}`;

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            const response = await fetch(apiUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }],
                generationConfig: {
                  responseMimeType: "application/json"
                }
              })
            });

            if (!response.ok) {
              throw new Error(`API HTTP Error: ${response.status}`);
            }

            const data = await response.json();
            const rawJsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            
            if (rawJsonText) {
              const parsedAI = JSON.parse(rawJsonText);
              const formattedPlan = {
                id: "plan_" + Date.now(),
                date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" }),
                profile: profileData,
                summary: parsedAI.summary,
                meals: parsedAI.meals,
                tips: parsedAI.tips
              };

              setCurrentPlan(formattedPlan);
              setGroceryChecked({});
              const updatedHistory = [formattedPlan, ...savedPlans];
              setSavedPlans(updatedHistory);
              localStorage.setItem("ai_diet_plans", JSON.stringify(updatedHistory));
              setIsGenerating(false);
              setActiveTab("plan");
              return;
            }
          } catch (err) {
            console.warn("Gemini API call failed. Falling back to local engine:", err);
            setStatusNotice("Note: Gemini API call failed. Used local AI engine fallback.");
          }
        }

        // Fallback flow
        setTimeout(() => {
          const fallbackPlan = generateFallbackPlan(profileData);
          setCurrentPlan(fallbackPlan);
          setGroceryChecked({});
          const updatedHistory = [fallbackPlan, ...savedPlans];
          setSavedPlans(updatedHistory);
          localStorage.setItem("ai_diet_plans", JSON.stringify(updatedHistory));
          setIsGenerating(false);
          setActiveTab("plan");
        }, 1000);
      };

      // Call Gemini 1.5 Flash for the AI Nutritionist Coach Chat
      const handleSendChatMessage = async (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;

        const userText = chatInput.trim();
        setChatMessages(prev => [...prev, { sender: "user", text: userText }]);
        setChatInput("");
        setIsChatThinking(true);

        if (apiKey) {
          try {
            const systemPrompt = `You are an expert, highly empathetic, and professional AI Nutritionist and Health Coach. Give clear, concise, practical, and customized advice using bullet points where helpful. 
Current User Context: Goal=${currentPlan?.profile?.goal || 'Health'}, Weight=${currentPlan?.profile?.weight || 70}kg, Dietary Restrictions=${currentPlan?.profile?.dietaryRestrictions || 'None'}. Keep responses under 200 words.`;

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            const response = await fetch(apiUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: userText }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
              })
            });

            if (response.ok) {
              const result = await response.json();
              const replyText = result.candidates?.[0]?.content?.parts?.[0]?.text;
              if (replyText) {
                setChatMessages(prev => [...prev, { sender: "ai", text: replyText }]);
                setIsChatThinking(false);
                return;
              }
            }
          } catch (err) {
            console.error("Chat API error:", err);
          }
        }

        // Local Smart Chatbot Fallback
        setTimeout(() => {
          let reply = "That is a great nutrition question! ";
          const lower = userText.toLowerCase();

          if (lower.includes("swap") || lower.includes("substitute") || lower.includes("replace")) {
            reply += "For high-protein breakfasts, you can swap eggs with silken tofu scrambled with turmeric, or Greek yogurt mixed with plant protein. For chicken, roasted chickpeas or paneer/tofu make ideal nutritional substitutes!";
          } else if (lower.includes("budget") || lower.includes("cheap") || lower.includes("cost")) {
            reply += "To keep your meals budget-friendly, buy staples like lentils, oats, frozen berries, canned beans, and seasonal green veggies in bulk.";
          } else if (lower.includes("snack") || lower.includes("hungry") || lower.includes("cravings")) {
            reply += "If you feel hungry between meals, opt for low-calorie high-volume options like sliced cucumbers with hummus, a hand of raw almonds, or a cup of green tea.";
          } else {
            reply += `To maximize your goal of ${currentPlan?.profile?.goal || "overall fitness"}, focus on meeting your target ${currentPlan?.summary?.protein || 120}g of protein daily and drinking ${currentPlan?.summary?.waterLiters || 2.5}L of water.`;
          }

          setChatMessages(prev => [...prev, { sender: "ai", text: reply }]);
          setIsChatThinking(false);
        }, 800);
      };

      const getCategorizedGrocery = () => {
        if (!currentPlan) return {};
        const produce = new Set();
        const proteinDairy = new Set();
        const pantryGrains = new Set();

        currentPlan.meals.forEach(m => {
          (m.ingredients || []).forEach(ing => {
            const lower = ing.toLowerCase();
            if (lower.includes("spinach") || lower.includes("avocado") || lower.includes("berries") || lower.includes("cucumber") || lower.includes("tomatoes") || lower.includes("broccoli") || lower.includes("asparagus") || lower.includes("sweet potato") || lower.includes("bell peppers") || lower.includes("lemon") || lower.includes("garlic")) {
              produce.add(ing);
            } else if (lower.includes("egg") || lower.includes("yogurt") || lower.includes("chicken") || lower.includes("salmon") || lower.includes("milk") || lower.includes("protein") || lower.includes("cheese")) {
              proteinDairy.add(ing);
            } else {
              pantryGrains.add(ing);
            }
          });
        });

        return {
          "Fresh Produce & Veggies": Array.from(produce),
          "Proteins & Dairy": Array.from(proteinDairy),
          "Pantry, Grains & Oils": Array.from(pantryGrains)
        };
      };

      // Download Selected (or All) Grocery Items
      const handleDownloadGrocery = (onlySelected = true) => {
        if (!currentPlan) return;

        const categorized = getCategorizedGrocery();
        let fileContent = `AI HEALTH & DIET TRACKER - GROCERY LIST\n`;
        fileContent += `Plan: ${currentPlan.profile.goal} (${currentPlan.profile.dietaryRestrictions || "Standard"})\n`;
        fileContent += `Generated: ${new Date().toLocaleDateString()}\n`;
        fileContent += `==========================================\n\n`;

        let totalIncluded = 0;

        Object.entries(categorized).forEach(([category, items]) => {
          const filteredItems = onlySelected
            ? items.filter(item => groceryChecked[item])
            : items;

          if (filteredItems.length > 0) {
            fileContent += `[ ${category.toUpperCase()} ]\n`;
            filteredItems.forEach(item => {
              const mark = groceryChecked[item] ? "[x]" : "[ ]";
              fileContent += `${mark} ${item}\n`;
              totalIncluded++;
            });
            fileContent += `\n`;
          }
        });

        if (totalIncluded === 0) {
          setStatusNotice("Please select at least one item to download!");
          setTimeout(() => setStatusNotice(""), 3000);
          return;
        }

        const blob = new Blob([fileContent], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = onlySelected ? "Selected_Grocery_List.txt" : "Full_Grocery_List.txt";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        setStatusNotice(`Downloaded ${totalIncluded} grocery item${totalIncluded > 1 ? "s" : ""}!`);
        setTimeout(() => setStatusNotice(""), 3000);
      };

      const handleDeletePlan = (id, e) => {
        e.stopPropagation();
        const filtered = savedPlans.filter(p => p.id !== id);
        setSavedPlans(filtered);
        localStorage.setItem("ai_diet_plans", JSON.stringify(filtered));
        if (currentPlan?.id === id) {
          setCurrentPlan(filtered[0] || null);
        }
      };

      // Calculate count of currently selected items in the active plan
      const selectedGroceryCount = currentPlan
        ? Object.values(getCategorizedGrocery())
            .flat()
            .filter(item => groceryChecked[item]).length
        : 0;

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          
          {/* --- TOP NAVIGATION BAR --- */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab("generator")}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-200">
                  <Icon name="heart-pulse" size={22} />
                </div>
                <div>
                  <span className="font-extrabold text-lg sm:text-xl text-slate-900 tracking-tight">AI Health Tracker</span>
                  <span className="hidden md:inline-block ml-2 text-xs font-semibold px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full">
                    Gemini 1.5 Powered
                  </span>
                </div>
              </div>

              <nav className="flex items-center space-x-1 sm:space-x-2">
                {[
                  { id: "generator", label: "Generator", icon: "sparkles" },
                  { id: "plan", label: "Diet Plan", icon: "utensils" },
                  { id: "chat", label: "AI Coach", icon: "bot" },
                  { id: "grocery", label: "Grocery List", icon: "shopping-bag" },
                  { id: "history", label: "History", icon: "history" }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex items-center space-x-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all ${
                      activeTab === tab.id
                        ? "bg-emerald-600 text-white shadow-sm"
                        : "text-slate-600 hover:text-slate-900 hover:bg-slate-100"
                    }`}
                  >
                    <Icon name={tab.icon} size={16} />
                    <span className="hidden md:inline">{tab.label}</span>
                  </button>
                ))}

                <button
                  onClick={() => {
                    setTempApiKey(apiKey);
                    setShowKeyModal(true);
                  }}
                  className={`p-2 rounded-xl text-xs font-bold transition flex items-center space-x-1 border ${
                    apiKey
                      ? "bg-emerald-50 border-emerald-300 text-emerald-700 hover:bg-emerald-100"
                      : "bg-amber-50 border-amber-300 text-amber-800 hover:bg-amber-100"
                  }`}
                  title="Configure Gemini API Key"
                >
                  <Icon name="key" size={16} />
                  <span className="hidden lg:inline">{apiKey ? "API Key Set" : "Add Key"}</span>
                </button>
              </nav>
            </div>
          </header>

          {statusNotice && (
            <div className="bg-emerald-600 text-white text-xs sm:text-sm font-medium py-2 px-4 text-center transition">
              {statusNotice}
            </div>
          )}

          {/* --- MAIN CONTENT ROUTING CONTAINER --- */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            
            {/* 1. DIET PLAN GENERATOR FORM */}
            {activeTab === "generator" && (
              <div className="max-w-2xl mx-auto">
                <div className="text-center mb-8">
                  <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
                    Generate Your AI Diet Plan
                  </h1>
                  <p className="text-slate-600 mt-2 text-sm sm:text-base">
                    Provide your biometric details and nutrition goals to instantly receive a personalized meal breakdown.
                  </p>
                </div>

                <div className="glass-card rounded-2xl p-6 sm:p-8 shadow-xl">
                  <form onSubmit={handleGeneratePlan} className="space-y-6">
                    
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Age (years)</label>
                        <input
                          type="number"
                          required
                          min="10"
                          max="120"
                          value={formData.age}
                          onChange={(e) => handleInputChange("age", e.target.value)}
                          className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none transition font-semibold text-slate-800"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Weight (kg)</label>
                        <input
                          type="number"
                          required
                          min="30"
                          max="300"
                          value={formData.weight}
                          onChange={(e) => handleInputChange("weight", e.target.value)}
                          className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none transition font-semibold text-slate-800"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Height (cm)</label>
                        <input
                          type="number"
                          required
                          min="100"
                          max="250"
                          value={formData.height}
                          onChange={(e) => handleInputChange("height", e.target.value)}
                          className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none transition font-semibold text-slate-800"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Fitness Goal</label>
                        <select
                          value={formData.goal}
                          onChange={(e) => handleInputChange("goal", e.target.value)}
                          className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none transition font-semibold text-slate-800"
                        >
                          <option value="Weight Loss">Weight Loss</option>
                          <option value="Muscle Gain">Muscle Gain</option>
                          <option value="Maintain Weight & Stay Fit">Maintain Weight & Stay Fit</option>
                          <option value="Heart Health & Lower Cholesterol">Heart Health & Lower Cholesterol</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Activity Level</label>
                        <select
                          value={formData.activity}
                          onChange={(e) => handleInputChange("activity", e.target.value)}
                          className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none transition font-semibold text-slate-800"
                        >
                          <option value="Sedentary (Little exercise)">Sedentary (Little exercise)</option>
                          <option value="Moderate Exercise (3-4 days/wk)">Moderate Exercise (3-4 days/wk)</option>
                          <option value="High Intensity (5-7 days/wk)">High Intensity (5-7 days/wk)</option>
                        </select>
                      </div>
                    </div>

                    {/* Dietary Restrictions Dropdown */}
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Dietary Restrictions & Preferences
                      </label>
                      <select
                        value={formData.dietaryRestriction}
                        onChange={(e) => handleInputChange("dietaryRestriction", e.target.value)}
                        className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none transition font-semibold text-slate-800 mb-3"
                      >
                        {DIETARY_OPTIONS.map((option) => (
                          <option key={option} value={option}>
                            {option}
                          </option>
                        ))}
                      </select>

                      <input
                        type="text"
                        placeholder="Optional: Add specific allergies or notes (e.g., Nut-free, Low Sodium)..."
                        value={customDietNote}
                        onChange={(e) => setCustomDietNote(e.target.value)}
                        className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none transition text-xs sm:text-sm font-medium text-slate-800"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={isGenerating}
                      className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center space-x-2 text-base mt-4"
                    >
                      {isGenerating ? (
                        <>
                          <Icon name="loader-2" size={20} className="animate-spin" />
                          <span>Generating Plan via Gemini 1.5 Flash...</span>
                        </>
                      ) : (
                        <>
                          <Icon name="sparkles" size={20} />
                          <span>Generate & Save Diet Plan</span>
                        </>
                      )}
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* 2. DIET PLAN RENDER VIEW */}
            {activeTab === "plan" && (
              currentPlan ? (
                <div className="space-y-8 max-w-5xl mx-auto">
                  
                  <div className="bg-gradient-to-r from-emerald-800 to-teal-900 rounded-2xl p-6 sm:p-8 text-white shadow-xl relative overflow-hidden">
                    <div className="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
                      <div>
                        <div className="flex items-center space-x-2 text-emerald-300 text-xs font-bold uppercase tracking-widest mb-1">
                          <Icon name="check-circle-2" size={14} />
                          <span>Active Diet Plan</span>
                        </div>
                        <h2 className="text-2xl sm:text-3xl font-extrabold">{currentPlan.profile.goal} Blueprint</h2>
                        <p className="text-emerald-100 text-sm mt-1">
                          Created on {currentPlan.date} • {currentPlan.profile.age} yrs, {currentPlan.profile.weight} kg ({currentPlan.profile.dietaryRestrictions || "Standard Diet"})
                        </p>
                      </div>

                      <div className="flex flex-wrap gap-2.5">
                        <button
                          onClick={() => setActiveTab("chat")}
                          className="px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-xl text-xs font-semibold backdrop-blur-md transition flex items-center space-x-1.5"
                        >
                          <Icon name="bot" size={16} />
                          <span>Ask AI Coach</span>
                        </button>
                        <button
                          onClick={() => setActiveTab("grocery")}
                          className="px-4 py-2 bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-bold rounded-xl text-xs transition flex items-center space-x-1.5 shadow-md"
                        >
                          <Icon name="shopping-bag" size={16} />
                          <span>Grocery Checklist</span>
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Summary Metric Cards */}
                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-4">
                    {[
                      { label: "Daily Calories", val: `${currentPlan.summary.calories} kcal`, icon: "flame", color: "text-amber-600 bg-amber-50" },
                      { label: "Protein Target", val: `${currentPlan.summary.protein}g`, icon: "dumbbell", color: "text-blue-600 bg-blue-50" },
                      { label: "Carbohydrates", val: `${currentPlan.summary.carbs}g`, icon: "wheat", color: "text-emerald-600 bg-emerald-50" },
                      { label: "Healthy Fats", val: `${currentPlan.summary.fats}g`, icon: "droplet", color: "text-purple-600 bg-purple-50" },
                      { label: "Water Intake", val: `${currentPlan.summary.waterLiters} L`, icon: "glass-water", color: "text-cyan-600 bg-cyan-50" }
                    ].map((stat, i) => (
                      <div key={i} className="glass-card rounded-2xl p-4 shadow-sm flex flex-col justify-between">
                        <div className="flex items-center justify-between mb-2">
                          <span className="text-xs font-bold text-slate-500 uppercase">{stat.label}</span>
                          <div className={`p-2 rounded-xl ${stat.color}`}>
                            <Icon name={stat.icon} size={18} />
                          </div>
                        </div>
                        <span className="text-xl sm:text-2xl font-extrabold text-slate-900">{stat.val}</span>
                      </div>
                    ))}
                  </div>

                  {/* Meals List */}
                  <div className="space-y-4">
                    <h3 className="text-xl font-bold text-slate-900 flex items-center space-x-2">
                      <Icon name="utensils" size={20} className="text-emerald-600" />
                      <span>Daily Meal Schedule</span>
                    </h3>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {currentPlan.meals.map((meal, idx) => (
                        <div key={idx} className="glass-card rounded-2xl p-6 shadow-sm flex flex-col justify-between border border-slate-200 hover:border-emerald-300 transition">
                          <div>
                            <div className="flex items-center justify-between mb-3">
                              <span className="px-3 py-1 bg-emerald-50 text-emerald-800 text-xs font-bold rounded-full">
                                {meal.type} • {meal.time}
                              </span>
                              <span className="text-xs font-extrabold text-slate-600 bg-slate-100 px-2.5 py-1 rounded-lg">
                                {meal.calories} kcal
                              </span>
                            </div>
                            <h4 className="text-base sm:text-lg font-bold text-slate-900 mb-2">{meal.name}</h4>
                            
                            <div className="flex items-center space-x-3 text-xs font-semibold text-slate-600 mb-4 bg-slate-50 p-2.5 rounded-xl">
                              <span>P: <strong className="text-slate-900">{meal.protein}</strong></span>
                              <span>•</span>
                              <span>C: <strong className="text-slate-900">{meal.carbs}</strong></span>
                              <span>•</span>
                              <span>F: <strong className="text-slate-900">{meal.fats}</strong></span>
                            </div>

                            <div className="space-y-1.5">
                              <span className="text-xs font-bold text-slate-700 uppercase tracking-wider">Ingredients:</span>
                              <div className="flex flex-wrap gap-1.5">
                                {(meal.ingredients || []).map((ing, iIdx) => (
                                  <span key={iIdx} className="text-xs bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg font-medium">
                                    {ing}
                                  </span>
                                ))}
                              </div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Pro Tips */}
                  {currentPlan.tips && currentPlan.tips.length > 0 && (
                    <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-6">
                      <h4 className="font-bold text-emerald-900 text-base mb-3 flex items-center space-x-2">
                        <Icon name="lightbulb" size={20} className="text-emerald-700" />
                        <span>AI Nutritionist Pro Tips</span>
                      </h4>
                      <ul className="space-y-2">
                        {currentPlan.tips.map((tip, tIdx) => (
                          <li key={tIdx} className="flex items-start space-x-2 text-sm text-emerald-800 font-medium">
                            <span className="text-emerald-600 font-bold">•</span>
                            <span>{tip}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                </div>
              ) : (
                <div className="text-center py-16">
                  <p className="text-slate-500 font-medium mb-4">No active diet plan found.</p>
                  <button
                    onClick={() => setActiveTab("generator")}
                    className="px-6 py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-md"
                  >
                    Generate a Plan Now
                  </button>
                </div>
              )
            )}

            {/* 3. AI COACH CHATBOT VIEW */}
            {activeTab === "chat" && (
              <div className="max-w-3xl mx-auto flex flex-col h-[75vh] glass-card rounded-2xl shadow-xl overflow-hidden">
                <div className="bg-slate-900 text-white p-4 px-6 flex items-center justify-between">
                  <div className="flex items-center space-x-3">
                    <div className="w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center text-white">
                      <Icon name="bot" size={20} />
                    </div>
                    <div>
                      <h3 className="font-bold text-base">Gemini 1.5 Nutrition Coach</h3>
                      <p className="text-xs text-slate-400">Ready for meal swaps & macro adjustments</p>
                    </div>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 custom-scrollbar">
                  {chatMessages.map((msg, index) => (
                    <div
                      key={index}
                      className={`flex items-start space-x-3 ${msg.sender === "user" ? "flex-row-reverse space-x-reverse" : ""}`}
                    >
                      <div className={`w-8 h-8 rounded-xl flex items-center justify-center shrink-0 ${
                        msg.sender === "user" ? "bg-emerald-600 text-white" : "bg-slate-200 text-slate-700"
                      }`}>
                        <Icon name={msg.sender === "user" ? "user" : "bot"} size={16} />
                      </div>
                      <div className={`max-w-[80%] p-4 rounded-2xl text-sm font-medium ${
                        msg.sender === "user"
                          ? "bg-emerald-600 text-white rounded-tr-none"
                          : "bg-slate-100 text-slate-800 rounded-tl-none border border-slate-200"
                      }`}>
                        {msg.text}
                      </div>
                    </div>
                  ))}

                  {isChatThinking && (
                    <div className="flex items-center space-x-3">
                      <div className="w-8 h-8 rounded-xl bg-slate-200 text-slate-700 flex items-center justify-center">
                        <Icon name="bot" size={16} />
                      </div>
                      <div className="bg-slate-100 p-3 rounded-2xl text-xs text-slate-500 flex items-center space-x-2">
                        <Icon name="loader-2" size={16} className="animate-spin" />
                        <span>Coach is thinking...</span>
                      </div>
                    </div>
                  )}
                  <div ref={chatEndRef} />
                </div>

                <form onSubmit={handleSendChatMessage} className="p-4 bg-white border-t border-slate-200 flex items-center space-x-2">
                  <input
                    type="text"
                    placeholder="Ask about meal swaps, calories, or recipes..."
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    className="flex-1 px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm font-medium"
                  />
                  <button
                    type="submit"
                    className="p-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl shadow-md transition"
                  >
                    <Icon name="send" size={18} />
                  </button>
                </form>
              </div>
            )}

            {/* 4. GROCERY LIST VIEW */}
            {activeTab === "grocery" && (
              <div className="max-w-3xl mx-auto space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900">Grocery Checklist</h2>
                    <p className="text-slate-600 text-sm mt-1">Select the items you need, then download your customized list.</p>
                  </div>

                  {currentPlan && (
                    <div className="flex flex-wrap items-center gap-2">
                      {selectedGroceryCount > 0 && (
                        <button
                          onClick={() => setGroceryChecked({})}
                          className="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-bold transition flex items-center space-x-1.5"
                          title="Clear all selections"
                        >
                          <Icon name="rotate-ccw" size={14} />
                          <span>Clear</span>
                        </button>
                      )}

                      <button
                        onClick={() => handleDownloadGrocery(true)}
                        disabled={selectedGroceryCount === 0}
                        className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 shadow-sm ${
                          selectedGroceryCount > 0
                            ? "bg-emerald-600 hover:bg-emerald-700 text-white cursor-pointer"
                            : "bg-slate-100 text-slate-400 border border-slate-200 cursor-not-allowed"
                        }`}
                      >
                        <Icon name="download" size={15} />
                        <span>Download Selected ({selectedGroceryCount})</span>
                      </button>

                      <button
                        onClick={() => handleDownloadGrocery(false)}
                        className="px-3.5 py-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 rounded-xl text-xs font-bold transition flex items-center space-x-1.5"
                        title="Download entire grocery list"
                      >
                        <Icon name="file-text" size={15} />
                        <span>Download All</span>
                      </button>
                    </div>
                  )}
                </div>

                {currentPlan ? (
                  <div className="space-y-6">
                    {Object.entries(getCategorizedGrocery()).map(([category, items], cIdx) => (
                      items.length > 0 && (
                        <div key={cIdx} className="glass-card rounded-2xl p-6 shadow-sm">
                          <h3 className="font-bold text-base text-emerald-800 mb-4 flex items-center space-x-2">
                            <Icon name="shopping-bag" size={18} />
                            <span>{category}</span>
                          </h3>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            {items.map((item, iIdx) => {
                              const isChecked = groceryChecked[item] || false;
                              return (
                                <div
                                  key={iIdx}
                                  onClick={() => setGroceryChecked(prev => ({ ...prev, [item]: !isChecked }))}
                                  className={`flex items-center space-x-3 p-3 rounded-xl border cursor-pointer transition ${
                                    isChecked
                                      ? "bg-emerald-50/70 border-emerald-400 text-emerald-950"
                                      : "bg-slate-50 border-slate-200 text-slate-800 hover:border-emerald-300"
                                  }`}
                                >
                                  <div className={`w-5 h-5 rounded-lg border flex items-center justify-center transition ${
                                    isChecked ? "bg-emerald-600 border-emerald-600 text-white" : "border-slate-300 bg-white"
                                  }`}>
                                    {isChecked && <Icon name="check" size={14} />}
                                  </div>
                                  <span className="text-sm font-semibold">{item}</span>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      )
                    ))}
                  </div>
                ) : (
                  <div className="text-center py-16 glass-card rounded-2xl">
                    <p className="text-slate-500 font-medium">Please generate a diet plan first to view your grocery checklist.</p>
                  </div>
                )}
              </div>
            )}

            {/* 5. HISTORY VIEW */}
            {activeTab === "history" && (
              <div className="max-w-3xl mx-auto space-y-6">
                <div>
                  <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900">Saved Diet Plans</h2>
                  <p className="text-slate-600 text-sm mt-1">Review or switch between your previously generated meal plans.</p>
                </div>

                <div className="space-y-4">
                  {savedPlans.length > 0 ? (
                    savedPlans.map(plan => (
                      <div
                        key={plan.id}
                        onClick={() => {
                          setCurrentPlan(plan);
                          setGroceryChecked({});
                          setActiveTab("plan");
                        }}
                        className={`glass-card rounded-2xl p-6 shadow-sm cursor-pointer border transition flex items-center justify-between ${
                          currentPlan?.id === plan.id ? "border-emerald-500 ring-2 ring-emerald-500/20 bg-emerald-50/30" : "border-slate-200 hover:border-emerald-300"
                        }`}
                      >
                        <div>
                          <div className="flex items-center space-x-2 mb-1">
                            <span className="font-extrabold text-lg text-slate-900">{plan.profile.goal}</span>
                            {currentPlan?.id === plan.id && (
                              <span className="text-xs bg-emerald-600 text-white font-bold px-2 py-0.5 rounded-full">Active</span>
                            )}
                          </div>
                          <p className="text-xs text-slate-500 font-medium">
                            Created on {plan.date} • {plan.summary.calories} kcal/day • {plan.profile.dietaryRestrictions || "Standard"}
                          </p>
                        </div>

                        <div className="flex items-center space-x-2">
                          <button
                            onClick={(e) => handleDeletePlan(plan.id, e)}
                            className="p-2.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl transition"
                            title="Delete Plan"
                          >
                            <Icon name="trash-2" size={16} />
                          </button>
                        </div>
                      </div>
                    ))
                  ) : (
                    <div className="text-center py-16 glass-card rounded-2xl">
                      <p className="text-slate-500 font-medium">No saved plans in your history.</p>
                    </div>
                  )}
                </div>
              </div>
            )}

          </main>

          {/* --- API KEY CONFIGURATION MODAL --- */}
          {showKeyModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center space-x-2">
                    <div className="p-2 rounded-xl bg-emerald-100 text-emerald-800">
                      <Icon name="key" size={20} />
                    </div>
                    <h3 className="font-extrabold text-lg text-slate-900">Gemini API Key</h3>
                  </div>
                  <button onClick={() => setShowKeyModal(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" size={20} />
                  </button>
                </div>

                <p className="text-xs text-slate-600 mb-4 leading-relaxed">
                  Enter your Google Gemini API key to enable live AI-generated diet plans and conversational coaching. If left blank, the app runs on its built-in offline nutrition engine.
                </p>

                <form onSubmit={handleSaveApiKey} className="space-y-4">
                  <input
                    type="password"
                    placeholder="Paste Gemini API Key (AIzaSy...)"
                    value={tempApiKey}
                    onChange={(e) => setTempApiKey(e.target.value)}
                    className="w-full px-3.5 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm font-mono text-slate-800"
                  />

                  <div className="flex items-center justify-end space-x-3 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowKeyModal(false)}
                      className="px-4 py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl text-xs font-bold transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md transition"
                    >
                      Save Key
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
