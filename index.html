<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Diet Tracker</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- jsPDF Library for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Preset Dietary Options ---
    const DIETARY_OPTIONS = [
      "No Restrictions",
      "Vegetarian",
      "Non-Vegetarian",
      "Eggetarian",
      "Vegan",
      "Keto",
      "High Protein",
      "Gluten-Free",
      "Dairy-Free"
    ];

    // --- Quick Prompts for AI Coach ---
    const QUICK_PROMPTS = [
      "Explain my current macros & calories",
      "Suggest high-protein meal swaps",
      "Healthy low-calorie snacks for cravings",
      "How can I hit my daily protein target?",
      "Budget-friendly alternatives for my meals",
      "Best meal timing & hydration tips"
    ];

    // --- Lucide Icon Wrapper Component ---
    function Icon({ name, size = 18, className = "" }) {
      const iconRef = useRef(null);

      useEffect(() => {
        if (window.lucide && iconRef.current) {
          window.lucide.createIcons({
            attrs: {
              class: `lucide lucide-${name} ${className}`
            },
            nameAttr: 'data-lucide'
          });
        }
      }, [name, className]);

      return <i ref={iconRef} data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
    }

    // --- Fallback Local AI Plan Generator ---
    function generateFallbackPlan(profile) {
      const isWeightLoss = profile.goal.toLowerCase().includes("loss");
      const isMuscle = profile.goal.toLowerCase().includes("muscle");

      const calories = isWeightLoss ? 1800 : isMuscle ? 2600 : 2100;
      const protein = isMuscle ? 170 : isWeightLoss ? 135 : 115;
      const carbs = isMuscle ? 275 : isWeightLoss ? 145 : 210;
      const fats = isWeightLoss ? 50 : isMuscle ? 70 : 60;

      const restriction = (profile.dietaryRestrictions || "").toLowerCase();
      const isVeg = (restriction.includes("vegetarian") && !restriction.includes("non-vegetarian")) || restriction.includes("vegan");
      const isKeto = restriction.includes("keto");

      return {
        id: "plan_" + Date.now(),
        date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" }),
        profile: { ...profile },
        summary: {
          calories,
          protein,
          carbs,
          fats,
          waterLiters: Math.round((Number(profile.weight || 70) * 0.035) * 10) / 10
        },
        meals: [
          {
            type: "Breakfast",
            time: "8:00 AM",
            name: isVeg ? "Avocado Toast & Greek Yogurt Bowl" : isKeto ? "Spinach & Mushroom Omelet with Avocado" : "Oatmeal Bowl with Berries & Scrambled Eggs",
            calories: Math.round(calories * 0.25),
            protein: isVeg ? "22g" : "30g",
            carbs: isKeto ? "10g" : "45g",
            fats: "14g",
            ingredients: isVeg ? ["Whole grain bread", "Avocado", "Greek Yogurt", "Berries", "Chia seeds"] : ["Eggs", "Spinach", "Avocado", "Olive Oil", "Berries"]
          },
          {
            type: "Lunch",
            time: "1:00 PM",
            name: isVeg ? "Quinoa Bowl with Roasted Chickpeas & Tahini" : "Grilled Chicken Quinoa Bowl with Steamed Veggies",
            calories: Math.round(calories * 0.35),
            protein: isVeg ? "28g" : "45g",
            carbs: "55g",
            fats: "18g",
            ingredients: isVeg ? ["Quinoa", "Chickpeas", "Cucumber", "Cherry tomatoes", "Tahini dressing"] : ["Chicken breast", "Quinoa", "Broccoli", "Olive oil", "Bell peppers"]
          },
          {
            type: "Afternoon Snack",
            time: "4:30 PM",
            name: "Protein Berry Smoothie & Mixed Almonds",
            calories: Math.round(calories * 0.15),
            protein: "20g",
            carbs: "25g",
            fats: "10g",
            ingredients: ["Almond milk", "Plant protein powder", "Frozen berries", "Almonds"]
          },
          {
            type: "Dinner",
            time: "7:30 PM",
            name: isVeg ? "Lentil & Vegetable Curry with Brown Rice" : "Pan-Seared Salmon with Asparagus & Sweet Potato",
            calories: Math.round(calories * 0.25),
            protein: isVeg ? "25g" : "40g",
            carbs: "40g",
            fats: "16g",
            ingredients: isVeg ? ["Lentils", "Brown Rice", "Coconut Milk", "Spinach", "Curry Spices"] : ["Salmon fillet", "Asparagus", "Sweet Potato", "Lemon", "Garlic"]
          }
        ],
        tips: [
          "Drink 500ml of fresh water upon waking up to optimize digestion.",
          `Ensure you distribute your target ${protein}g of protein evenly across all 4 meals.`,
          "Finish dinner at least 2.5 hours before sleeping for enhanced metabolic repair."
        ]
      };
    }

    // --- Context-Aware Smart Coach Response Engine ---
    function generateSmartCoachReply(question, currentPlan) {
      const q = question.toLowerCase();
      const goal = currentPlan?.profile?.goal || "overall fitness";
      const weight = currentPlan?.profile?.weight || 70;
      const diet = currentPlan?.profile?.dietaryRestrictions || "Standard";
      const isVeg = (diet.toLowerCase().includes("vegetarian") && !diet.toLowerCase().includes("non-vegetarian")) || diet.toLowerCase().includes("vegan");
      const cal = currentPlan?.summary?.calories || 2000;
      const pro = currentPlan?.summary?.protein || 130;
      const carbs = currentPlan?.summary?.carbs || 200;
      const fats = currentPlan?.summary?.fats || 60;
      const water = currentPlan?.summary?.waterLiters || 2.5;
      const meals = currentPlan?.meals || [];

      if (q.includes("macro") || q.includes("explain") || q.includes("calorie") || q.includes("breakdown") || q.includes("my plan")) {
        return `Here is how your ${cal} kcal daily target supports your "${goal}" goal (${diet}):\n\n` +
          `• Protein (${pro}g / ${Math.round((pro * 4 / cal) * 100)}%): Preserves and builds lean muscle tissue while keeping you full longer.\n` +
          `• Carbs (${carbs}g / ${Math.round((carbs * 4 / cal) * 100)}%): Fuels workouts, brain focus, and daily energy without crashes.\n` +
          `• Healthy Fats (${fats}g / ${Math.round((fats * 9 / cal) * 100)}%): Supports hormone balance and fat-soluble vitamin absorption.\n` +
          `• Hydration (${water}L): Tailored to your ${weight} kg body weight for optimal metabolism.`;
      }

      if (q.includes("swap") || q.includes("substitute") || q.includes("replace") || q.includes("alternative") || q.includes("instead")) {
        const mealNames = meals.map(m => `${m.type}: ${m.name}`).join("\n• ");
        if (isVeg) {
          return `Smart ${diet} swaps that match your ${pro}g protein target:\n\n` +
            `• Breakfast: Swap Greek yogurt/toast with scrambled tofu bhurji + multigrain roti, or overnight oats with chia & protein powder.\n` +
            `• Lunch: Swap quinoa/chickpeas with grilled paneer or soya chunks stir-fry with brown rice.\n` +
            `• Dinner: Swap lentil curry with moong dal chilla or black bean & veggie bowl.\n\n` +
            (mealNames ? `Your current meals:\n• ${mealNames}` : "");
        }
        return `Smart swaps tailored to your ${diet} plan (${cal} kcal):\n\n` +
          `• Breakfast: Swap eggs/oats with Greek yogurt parfait + whey/plant protein, or egg-white veggie omelet with whole-wheat toast.\n` +
          `• Lunch: Swap chicken breast with grilled fish, lean turkey, or tofu/paneer bowl.\n` +
          `• Dinner: Swap salmon with grilled chicken thighs, shrimp stir-fry, or lentil & egg curry.\n\n` +
          (mealNames ? `Your current meals:\n• ${mealNames}` : "");
      }

      if (q.includes("protein") || q.includes("muscle") || q.includes("hit my")) {
        const perMeal = Math.round(pro / 4);
        return `To comfortably hit ${pro}g of protein per day:\n\n` +
          `• Aim for ~${perMeal}g of protein in each of your 4 meals instead of loading it all at dinner.\n` +
          (isVeg
            ? `• Top ${diet} sources: Soya chunks (52g/100g), low-fat paneer (18g/100g), Greek yogurt (10g/100g), lentils/dal, tofu, and whey/plant protein.\n`
            : `• Top ${diet} sources: Chicken breast (31g/100g), eggs (6g each), fish/salmon (22g/100g), Greek yogurt, cottage cheese/paneer, and whey protein.\n`) +
          `• Pro tip: Eat your protein portion first at every meal to boost satiety.`;
      }

      if (q.includes("snack") || q.includes("hungry") || q.includes("craving") || q.includes("sweet") || q.includes("night")) {
        return `Best low-calorie, high-satiety snacks that won't derail your ${cal} kcal budget:\n\n` +
          `• Savory crunch (~100 kcal): Roasted makhana (fox nuts), cucumber & carrot sticks with 2 tbsp hummus, or air-popped popcorn.\n` +
          `• Sweet craving (~130 kcal): 150g Greek yogurt with cinnamon & berries, or 1 square (85%) dark chocolate with 5 almonds.\n` +
          `• Hunger check: Drink a full glass of water and wait 10 minutes—mild dehydration often mimics hunger.`;
      }

      if (q.includes("budget") || q.includes("cheap") || q.includes("cost") || q.includes("affordable") || q.includes("money")) {
        return `How to follow your ${goal} plan on a student/budget-friendly grocery bill:\n\n` +
          `• Swap expensive grains (quinoa) for oats, brown rice, or whole-wheat rotis.\n` +
          `• Swap berries & asparagus for seasonal local vegetables (spinach, carrots, cabbage, bell peppers) and bananas.\n` +
          (isVeg
            ? `• Best budget proteins: Soya chunks, whole moong/chana, lentils (dal), peanuts, and curd.\n`
            : `• Best budget proteins: Whole eggs, chicken breast bought in bulk, lentils, and curd.\n`) +
          `• Batch-cook grains and lentils for 2–3 days at once to save both money and prep time.`;
      }

      if (q.includes("time") || q.includes("timing") || q.includes("when") || q.includes("water") || q.includes("hydrat") || q.includes("workout") || q.includes("pre") || q.includes("post")) {
        return `Optimal meal timing & hydration schedule for your ${goal} plan:\n\n` +
          `• Morning (7:30–8:30 AM): Drink 500ml water on waking, followed by breakfast within 60–90 minutes.\n` +
          `• Pre-Workout (45–60 min before): Have a light carb + protein snack (e.g., banana + handful of almonds or your afternoon smoothie).\n` +
          `• Post-Workout (within 60 min): Eat your highest-protein meal (${meals[1]?.name || "Lunch"}) to maximize recovery.\n` +
          `• Evening: Finish dinner at least 2.5 hours before bed and spread ${water}L of water steadily across the day.`;
      }

      if (q.includes("weight loss") || q.includes("lose weight") || q.includes("fat loss") || q.includes("plateau")) {
        return `Key habits to accelerate fat loss on your ${cal} kcal plan:\n\n` +
          `• Keep protein high at ${pro}g/day so you lose fat rather than muscle.\n` +
          `• Watch hidden liquid calories (sugary tea/coffee, juices) and cooking oils—measure oils with a teaspoon.\n` +
          `• Add 7,000–10,000 daily steps alongside your workouts to increase calorie burn without spiking hunger.`;
      }

      // General fallback tailored to user's actual current plan
      const firstMeal = meals[0]?.name || "a balanced high-protein breakfast";
      return `For your ${goal} goal (${cal} kcal/day, ${diet}):\n\n` +
        `• Daily Targets: ${pro}g protein, ${carbs}g carbs, ${fats}g fats, and ${water}L water.\n` +
        `• Start Strong: Stick with ${firstMeal} to stabilize blood sugar and curb afternoon cravings.\n` +
        `• Need specifics? Ask me about meal swaps, hitting your ${pro}g protein goal, budget groceries, or healthy snacks!`;
    }

    // --- Main React Application Component ---
    function App() {
      const [activeTab, setActiveTab] = useState("generator");

      // API Key & Key Modal State
      const [apiKey, setApiKey] = useState(() => localStorage.getItem("gemini_user_api_key") || "");
      const [showKeyModal, setShowKeyModal] = useState(false);
      const [tempApiKey, setTempApiKey] = useState("");

      // Fluid Form Input State
      const [formData, setFormData] = useState({
        age: "26",
        weight: "72",
        height: "178",
        goal: "Weight Loss",
        activity: "Moderate Exercise (3-4 days/wk)",
        dietaryRestriction: "Vegetarian"
      });

      const [customDietNote, setCustomDietNote] = useState("");

      // Application Data State
      const [currentPlan, setCurrentPlan] = useState(null);
      const [savedPlans, setSavedPlans] = useState([]);
      const [isGenerating, setIsGenerating] = useState(false);
      const [statusNotice, setStatusNotice] = useState("");

      // Chatbot State
      const [chatMessages, setChatMessages] = useState([
        { sender: "ai", text: "Hello! I am your AI Health & Nutrition Coach. Tap a quick prompt below or ask me anything about your meal plan, macro targets, swaps, or cravings!" }
      ]);
      const [chatInput, setChatInput] = useState("");
      const [isChatThinking, setIsChatThinking] = useState(false);

      // Grocery Checklist Checked Items State
      const [groceryChecked, setGroceryChecked] = useState({});
      const chatEndRef = useRef(null);

      useEffect(() => {
        const storedPlans = localStorage.getItem("ai_diet_plans");
        if (storedPlans) {
          try {
            const parsed = JSON.parse(storedPlans);
            setSavedPlans(parsed);
            if (parsed.length > 0) setCurrentPlan(parsed[0]);
          } catch (err) {
            console.error("Failed to parse local history:", err);
          }
        } else {
          const initialPlan = generateFallbackPlan({
            age: 26, weight: 72, height: 178, goal: "Weight Loss", dietaryRestrictions: "Vegetarian"
          });
          setCurrentPlan(initialPlan);
          setSavedPlans([initialPlan]);
          localStorage.setItem("ai_diet_plans", JSON.stringify([initialPlan]));
        }
      }, []);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [chatMessages, isChatThinking]);

      const handleSaveApiKey = (e) => {
        e.preventDefault();
        const trimmed = tempApiKey.trim();
        setApiKey(trimmed);
        localStorage.setItem("gemini_user_api_key", trimmed);
        setShowKeyModal(false);
        setStatusNotice(trimmed ? "Custom Gemini API Key saved!" : "Using built-in/fallback generator mode.");
        setTimeout(() => setStatusNotice(""), 3000);
      };

      const handleInputChange = (field, value) => {
        setFormData(prev => ({ ...prev, [field]: value }));
      };

      // Call Gemini API to Generate Diet Plan
      const handleGeneratePlan = async (e) => {
        e.preventDefault();
        setIsGenerating(true);
        setStatusNotice("");

        const finalDietaryString = customDietNote.trim()
          ? `${formData.dietaryRestriction}, ${customDietNote.trim()}`
          : formData.dietaryRestriction;

        const profileData = {
          age: Number(formData.age) || 25,
          weight: Number(formData.weight) || 70,
          height: Number(formData.height) || 175,
          goal: formData.goal,
          activity: formData.activity,
          dietaryRestrictions: finalDietaryString
        };

        if (apiKey) {
          try {
            const promptText = `Generate a structured daily diet and nutrition plan for a person with this profile:
- Age: ${profileData.age} years
- Weight: ${profileData.weight} kg
- Height: ${profileData.height} cm
- Fitness Goal: ${profileData.goal}
- Activity Level: ${profileData.activity}
- Dietary Restrictions/Preferences: ${profileData.dietaryRestrictions}

Return ONLY a valid JSON object with this EXACT structure (no markdown fences around the json, just raw json):
{
  "summary": {
    "calories": number,
    "protein": number,
    "carbs": number,
    "fats": number,
    "waterLiters": number
  },
  "meals": [
    {
      "type": "Breakfast",
      "time": "8:00 AM",
      "name": "Meal name",
      "calories": number,
      "protein": "30g",
      "carbs": "40g",
      "fats": "12g",
      "ingredients": ["item 1", "item 2", "item 3"]
    },
    {
      "type": "Lunch",
      "time": "1:00 PM",
      "name": "Meal name",
      "calories": number,
      "protein": "45g",
      "carbs": "50g",
      "fats": "15g",
      "ingredients": ["item 1", "item 2"]
    },
    {
      "type": "Afternoon Snack",
      "time": "4:30 PM",
      "name": "Meal name",
      "calories": number,
      "protein": "20g",
      "carbs": "20g",
      "fats": "8g",
      "ingredients": ["item 1", "item 2"]
    },
    {
      "type": "Dinner",
      "time": "7:30 PM",
      "name": "Meal name",
      "calories": number,
      "protein": "40g",
      "carbs": "35g",
      "fats": "14g",
      "ingredients": ["item 1", "item 2"]
    }
  ],
  "tips": ["Tip 1", "Tip 2", "Tip 3"]
}`;

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`;
            const response = await fetch(apiUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }],
                generationConfig: {
                  responseMimeType: "application/json"
                }
              })
            });

            if (!response.ok) {
              throw new Error(`API HTTP Error: ${response.status}`);
            }

            const data = await response.json();
            const rawJsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;

            if (rawJsonText) {
              const parsedAI = JSON.parse(rawJsonText);
              const formattedPlan = {
                id: "plan_" + Date.now(),
                date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" }),
                profile: profileData,
                summary: parsedAI.summary,
                meals: parsedAI.meals,
                tips: parsedAI.tips
              };

              setCurrentPlan(formattedPlan);
              setGroceryChecked({});
              const updatedHistory = [formattedPlan, ...savedPlans];
              setSavedPlans(updatedHistory);
              localStorage.setItem("ai_diet_plans", JSON.stringify(updatedHistory));
              setIsGenerating(false);
              setActiveTab("plan");
              return;
            }
          } catch (err) {
            console.warn("Gemini API call failed. Falling back to local engine:", err);
            setStatusNotice("Note: Gemini API call failed. Used local AI engine fallback.");
          }
        }

        // Fallback flow
        setTimeout(() => {
          const fallbackPlan = generateFallbackPlan(profileData);
          setCurrentPlan(fallbackPlan);
          setGroceryChecked({});
          const updatedHistory = [fallbackPlan, ...savedPlans];
          setSavedPlans(updatedHistory);
          localStorage.setItem("ai_diet_plans", JSON.stringify(updatedHistory));
          setIsGenerating(false);
          setActiveTab("plan");
        }, 1000);
      };

      // Unified Send Message Handler (used by both form submit & quick prompts)
      const sendCoachQuestion = async (rawQuestion) => {
        const userText = (rawQuestion || "").trim();
        if (!userText || isChatThinking) return;

        const updatedHistory = [...chatMessages, { sender: "user", text: userText }];
        setChatMessages(updatedHistory);
        setChatInput("");
        setIsChatThinking(true);

        if (apiKey) {
          try {
            const planContext = currentPlan
              ? `Active User Profile & Plan:
- Age: ${currentPlan.profile.age}, Weight: ${currentPlan.profile.weight}kg, Height: ${currentPlan.profile.height}cm
- Goal: ${currentPlan.profile.goal}
- Dietary Preference: ${currentPlan.profile.dietaryRestrictions || "None"}
- Daily Targets: ${currentPlan.summary.calories} kcal, ${currentPlan.summary.protein}g protein, ${currentPlan.summary.carbs}g carbs, ${currentPlan.summary.fats}g fats, ${currentPlan.summary.waterLiters}L water
- Current Meals: ${(currentPlan.meals || []).map(m => `${m.type} (${m.name} - ${m.calories} kcal, ${m.protein} protein)`).join("; ")}`
              : "No active plan generated yet.";

            const systemPrompt = `You are an expert, practical AI Nutritionist and Health Coach. Directly answer the user's specific question using their active diet plan and profile details. Use clear bullet points, exact numbers, and actionable food options. Keep responses concise (under 200 words) and avoid markdown asterisks for bolding so plain text renders cleanly.\n\n${planContext}`;

            // Include recent conversation turns for proper multi-turn follow-up context
            const conversationContents = updatedHistory.slice(-6).map(msg => ({
              role: msg.sender === "user" ? "user" : "model",
              parts: [{ text: msg.text }]
            }));

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`;
            const response = await fetch(apiUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: conversationContents,
                systemInstruction: { parts: [{ text: systemPrompt }] }
              })
            });

            if (response.ok) {
              const result = await response.json();
              const replyText = result.candidates?.[0]?.content?.parts?.[0]?.text;
              if (replyText) {
                setChatMessages(prev => [...prev, { sender: "ai", text: replyText.replace(/\*\*/g, "") }]);
                setIsChatThinking(false);
                return;
              }
            }
          } catch (err) {
            console.error("Chat API error:", err);
          }
        }

        // Local Context-Aware Smart Fallback
        setTimeout(() => {
          const reply = generateSmartCoachReply(userText, currentPlan);
          setChatMessages(prev => [...prev, { sender: "ai", text: reply }]);
          setIsChatThinking(false);
        }, 500);
      };

      const handleSendChatMessage = (e) => {
        e.preventDefault();
        sendCoachQuestion(chatInput);
      };

      const handleQuickPromptClick = (promptText) => {
        sendCoachQuestion(promptText);
      };

      const handleClearChat = () => {
        setChatMessages([
          { sender: "ai", text: "Chat cleared! Tap a quick prompt below or ask me any question about your diet plan." }
        ]);
      };

      const getCategorizedGrocery = () => {
        if (!currentPlan) return {};
        const produce = new Set();
        const proteinDairy = new Set();
        const pantryGrains = new Set();

        currentPlan.meals.forEach(m => {
          (m.ingredients || []).forEach(ing => {
            const lower = ing.toLowerCase();
            if (lower.includes("spinach") || lower.includes("avocado") || lower.includes("berries") || lower.includes("cucumber") || lower.includes("tomatoes") || lower.includes("broccoli") || lower.includes("asparagus") || lower.includes("sweet potato") || lower.includes("bell peppers") || lower.includes("lemon") || lower.includes("garlic")) {
              produce.add(ing);
            } else if (lower.includes("egg") || lower.includes("yogurt") || lower.includes("chicken") || lower.includes("salmon") || lower.includes("milk") || lower.includes("protein") || lower.includes("cheese")) {
              proteinDairy.add(ing);
            } else {
              pantryGrains.add(ing);
            }
          });
        });

        return {
          "Fresh Produce & Veggies": Array.from(produce),
          "Proteins & Dairy": Array.from(proteinDairy),
          "Pantry, Grains & Oils": Array.from(pantryGrains)
        };
      };

      const toggleGroceryItem = (item) => {

            doc.setFontSize(12);

            yPos += 7;

            doc.setFontSize(11);
            doc.setTextColor(30, 41, 59);

              doc.text(`${mark}  ${item}`, 18, yPos);

                        <button
                          onClick={() => handleDownloadGroceryPDF(false)}
                          className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold rounded-xl flex items-center space-x-1.5 transition"
                        >
                          <Icon name="file-text" size={15} />
                          <span>Full List PDF</span>
                        </button>
                      </div>
                    </div>

                    <div className="space-y-6">
                      {Object.entries(getCategorizedGrocery()).map(([category, items]) => (
                        items.length > 0 && (
                          <div key={category}>
                            <h3 className="text-xs font-extrabold uppercase tracking-wider text-emerald-700 mb-3">
                              {category}
                            </h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                              {items.map((item) => {
                                const checked = !!groceryChecked[item];
                                return (
                                  <label
                                    key={item}
                                    onClick={() => toggleGroceryItem(item)}
                                    className={`flex items-center space-x-3 p-3 rounded-xl border cursor-pointer transition ${
                                      checked
                                        ? "bg-emerald-50/70 border-emerald-200 text-slate-500 line-through"
                                        : "bg-slate-50 border-slate-200 text-slate-800 hover:bg-slate-100"
                                    }`}
                                  >
                                    <input
                                      type="checkbox"
                                      checked={checked}
                                      onChange={() => {}}
                                      className="w-4 h-4 accent-emerald-600 rounded"
                                    />
                                    <span className="text-sm font-medium">{item}</span>
                                  </label>
                                );
                              })}
                            </div>
                          </div>
                        )
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 5. PLAN HISTORY VIEW */}
            {activeTab === "history" && (
              <div className="max-w-3xl mx-auto space-y-4">
                <h2 className="text-2xl font-extrabold text-slate-900 mb-4">Saved Diet Plans</h2>
                {savedPlans.length === 0 ? (
                  <div className="glass-card rounded-2xl p-8 text-center text-slate-500 text-sm">
                    No saved plans yet.
                  </div>
                ) : (
                  savedPlans.map((plan) => (
                    <div
                      key={plan.id}
                      onClick={() => {
                        setCurrentPlan(plan);
                        setGroceryChecked({});
                        setActiveTab("plan");
                      }}
                      className={`glass-card rounded-2xl p-5 flex items-center justify-between cursor-pointer transition hover:border-emerald-400 ${
                        currentPlan?.id === plan.id ? "ring-2 ring-emerald-500" : ""
                      }`}
                    >
                      <div>
                        <p className="font-bold text-slate-900">
                          {plan.profile.goal} • <span className="text-emerald-700">{plan.summary.calories} kcal</span>
                        </p>
                        <p className="text-xs text-slate-500 mt-1">
                          {plan.profile.dietaryRestrictions || "Standard"} • {plan.date}
                        </p>
                      </div>
                      <button
                        onClick={(e) => handleDeletePlan(plan.id, e)}
                        className="p-2 text-slate-400 hover:text-rose-600 rounded-lg transition"
                        title="Delete Plan"
                      >
                        <Icon name="trash-2" size={18} />
                      </button>
                    </div>
                  ))
                )}
              </div>
            )}

          </main>

          {/* --- GEMINI API KEY MODAL --- */}
          {showKeyModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-extrabold text-slate-900 flex items-center space-x-2">
                    <Icon name="key" size={18} className="text-emerald-600" />
                    <span>Gemini API Key</span>
                  </h3>
                  <button
                    onClick={() => setShowKeyModal(false)}
                    className="text-slate-400 hover:text-slate-700"
                  >
                    <Icon name="x" size={20} />
                  </button>
                </div>
                <p className="text-xs text-slate-600 leading-relaxed">
                  Enter a Gemini API key to generate live AI meal plans and chat responses. Without a key, the app automatically uses its built-in nutrition engine. Your key is stored only in your browser.
                </p>
                <form onSubmit={handleSaveApiKey} className="space-y-4">
                  <input
                    type="password"
                    value={tempApiKey}
                    onChange={(e) => setTempApiKey(e.target.value)}
                    placeholder="AIza..."
                    className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                  />
                  <div className="flex justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => {
                        setTempApiKey("");
                      }}
                      className="px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl"
                    >
                      Clear
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl"
                    >
                      Save Key
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
